<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Report Card</title>
</head>
<body>
    <main>
        <table border="1">
<caption>Student Report Card</caption>

<thead>

    <tr>
        <th rowspan="2">Students</th>
        <th colspan="3">Marks</th>
    </tr>
    <tr>
        <th>Math</th>
        <th>Science</th>
        <th>English</th>
    </tr>
</thead>
<tbody>

    <tr>
<td>Amrita</td>
<td>95</td>
<td>98</td>
<td>96</td>
    </tr>
    
    <tr>
        <td>Alia</td>
        <td>90</td>
        <td>97</td>
        <td>94</td>
    </tr>
    <tr>
        <td>Rani</td>
        <td>87</td>
        <td>90
        </td>
        <td>78</td>
    </tr>


</tbody>
<tfoot>
<tr>
    <td colspan="4">Total Students: 3</td>
</tr>

</tfoot>



        </table>

    </main>
    
</body>
</html>
